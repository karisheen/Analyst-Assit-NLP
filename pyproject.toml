[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fundamental-forecast-lab"
version = "0.1.0"
description = "Point-in-time disclosure and business-outcome forecasting research"
requires-python = ">=3.12"
dependencies = ["scikit-learn==1.7.2", "pypdf==6.1.1", "cryptography==46.0.2"]
[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.13.2", "mypy==1.18.2"]

[project.scripts]
forecast-lab = "forecast_lab.cli:main"

[tool.setuptools.packages.find]
include = ["forecast_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
ignore_missing_imports = true
